<body class="bgc p-3 antialiased">

	<!-- audio -->

	<div id="modal" class="z-30 px-3 w-full fixed top-0 left-0 right-0 flex-col justify-center items-center hidden">
	</div>
	<div id="openAppModal"
		class="z-30 px-3 w-full fixed top-0 left-0 right-0 flex-col justify-center items-center hidden"></div>

	<div class="text-base antialiased flex flex-col w-full justify-center items-center">

		<div id="loginPage"
			class="relative bg rounded-2xl w-full flex flex-col space-y-6 md:w-5/12 lg:w-4/12 overflow-hidden">


			<!-- fitur audio -->
			<div id="audio" class="w-full pb-6 justify-center items-center hidden"></div>


			<!-- fitur header -->
			<div id="header" class="w-full flex-col justify-center items-center hidden px-3 space-y-3"></div>


			<!-- fitur media sosial -->
			<div id="socialMedia" class="w-full space-x-6 justify-center items-center px-3 hidden"></div>


			<!-- fitur running text -->
			<div id="runningText" class="w-full flex-col -space-y-1 px-3 hidden"></div>


			<!-- fitur date & prayTimes -->
			<div id="date_and_praytimes" class="w-full px-3 space-y-2 hidden">
				<div id="date" class="w-full justify-between items-center hidden"></div>
				<div id="prayerTimes" class="w-full hidden"></div>
			</div>


			


			<!-- fitur form login -->
			<div id="home" class="w-full flex flex-col px-3 space-y-3">

				<div class="w-full flex">

					<div id="formLogin" class="w-full flex flex-col space-y-3">

						<p id="labelForm" style="font-weight: bold;" class="text-2xl text-center"></p>

						<!-- kontrol mode login (ADR 0006): tersembunyi selama hanya satu mode aktif -->
						<div id="loginModes" class="w-full hidden"></div>

						<div class="hidden">
							$(if chap-id)
							<form name="sendin" action="$(link-login-only)" method="post">
								<input type="hidden" name="username" />
								<input type="hidden" name="password" />
								<input type="hidden" name="dst" value="$(link-orig)" />
								<input type="hidden" name="popup" value="true" />
							</form>
							$(endif)
							<a href="$(link-login-only)?target=lv&amp;dst=$(link-orig-esc)"></a>
						</div>

						<form name="login" action="$(link-login-only)" method="post" $(if chap-id)
							onSubmit="return doLogin()" $(endif)>
							<input type="hidden" name="dst" value="$(link-orig)" />
							<input type="hidden" name="popup" value="true" />
							<div class="flex flex-col space-y-3 w-full">

								<div id="domUsername" class="w-full">
									<div
										class="input w-full flex justify-center items-center rounded-full shadow-indigo-500-20">
										<div class="w-full flex px-1 justify-between items-center">
											<input type="text" name="username" placeholder="username" id="username"
												autocomplete="off" value="$(username)"
												class="z-20 px-4 py-4 text-lg md:text-lg lg:text-lg placeholder:text-slate-600 bg-transparent outline-none w-full">
											<div id="iconTypePasswordUser" onclick="changeTypePassUser(this)"
												class="z-20 px-3 text-center cursor-pointer"></div>
										</div>
									</div>
								</div>

								<div id="domPassword" class="w-full hidden">
									<div
										class="input w-full flex justify-center items-center rounded-full shadow-indigo-500-20">
										<div class="w-full flex px-1 justify-between items-center">
											<input type="password" name="password" placeholder="password" id="password"
												autocomplete="off"
												class="z-20 px-4 py-4 text-lg md:text-lg lg:text-lg placeholder:text-slate-600 bg-transparent outline-none w-full">
											<div id="iconTypePassword" onclick="changeTypePass(this)"
												class="z-20 px-3 text-center cursor-pointer"></div>
										</div>
									</div>
								</div>

								<div class="w-full">
									$(if error)
									<div id="serverError" class="alert w-full flex">
										$(error)
									</div>
									$(endif)
									<div id="loginError" class="alert w-full hidden"></div>
								</div>

								<div class="w-full">
									<input type="hidden" id="voucherActive" value="0">
									<div
										class="btnBg w-full flex justify-center items-center rounded-full shadow-indigo-500-20">
										<button id="btnLogin" type="submit"
											class="z-20 justify-center items-center w-full px-6 py-4 text-lg md:text-lg lg:text-lg font-semibold"></button>
									</div>
								</div>

							</div>
						</form>

						<div id="secLink" class="linkColor pt-3 z-10 w-full flex space-x-6 justify-center items-center">
							<div id="loginOpt" onclick="loginOpt()"
								class="w-max cursor-pointer space-x-1 justify-center items-center hidden"></div>
							<div id="btnTrial"
								class="w-max cursor-pointer space-x-1 justify-center items-center hidden"></div>
							<div id="btnLogInQrCode"
								class="w-max cursor-pointer space-x-1 justify-center items-center hidden"></div>
						</div>
					</div>
				</div>

			</div>

			<!-- fitur slider -->
			<div id="slide" class="w-full px-3 hidden"></div>
			
			<!-- fitur paket -->
			<div id="paketInternet" class="z-10 px-3 w-full hidden"></div>


			<!-- fitur biolink -->
			<div id="bioLink" class="z-10 px-3 w-full hidden"></div>


			<!-- fitur store -->
			<div id="store" class="w-full hidden"></div>


			<!-- fitur faq -->
			<div id="faq" class="z-10 w-full px-3 hidden"></div>


			<!-- fitur footer -->
			<div id="copyRight" class="z-10 w-full px-3 hidden"></div>


			<div id="lastSec" class="w-full lg:hidden">&nbsp;</div>


			<!-- fitur chat -->
			<div id="chat"></div>

		</div>
	</div>

	<a id="linkTrial" href="$(link-login-only)?dst=$(link-orig-esc)&amp;username=T-$(mac-esc)"></a>
	<p id="isTrial" class="hidden">$(trial)</p>

	<script src="./config/data/style.js?v=21.1"></script>

	<script>
		function showLoginError(message) {
			var box = document.getElementById("loginError");
			if (!box) {
				return;
			}
			box.textContent = message;
			box.classList.remove("hidden");
			box.classList.add("flex");
		}

		function doLogin() {
			var client = window.VoucherClient && window.VoucherClient.client;
			var mode = window.currentLoginMode || "phone";
			var usernameInput = document.getElementById("username");
			var passwordInput = document.getElementById("password");

			function submitPayload(payload) {
				document.sendin.username.value = payload.username;
				document.sendin.password.value = payload.password;
				document.sendin.submit();
			}

			if (client && typeof client.login === "function") {
				try {
					// The mode descriptor maps the form slots onto the credential keys
					// it expects, so the seam path never hardcodes a mode's fields.
					var credentials = client.loginCredentials(mode, {
						primary: usernameInput ? usernameInput.value : "",
						secondary: passwordInput ? passwordInput.value : "",
					});
					credentials.mode = mode;
					credentials.chapId = "$(chap-id)";
					credentials.chapChallenge = "$(chap-challenge)";
					credentials.submit = submitPayload;
					client.login(credentials);
				} catch (error) {
					showLoginError(client.describeLoginError(error, mode));
				}
				return false;
			}

			// Fallback when the voucher client is unavailable: still hash only the credential.
			submitPayload({
				username: usernameInput ? usernameInput.value : "",
				password: hexMD5("$(chap-id)" + (passwordInput ? passwordInput.value : "") + "$(chap-challenge)"),
			});
			return false;
		}

		var username = document.getElementById("username");
		var password = document.getElementById("password");

		var changeTypePass = function (el) {
			const pass = document.getElementById("password");
			const type = pass.getAttribute("type");
			if (type == "text") {
				el.innerHTML = IconEyeClosed(cfgStyle.input.icon, "w-6 h-6 md:w-8 md:h-8 lg:w-6 lg:h-6");
				pass.setAttribute("type", "password");
			} else {
				el.innerHTML = IconEye(cfgStyle.input.icon, "w-6 h-6 md:w-8 md:h-8 lg:w-6 lg:h-6");
				pass.setAttribute("type", "text");
			}
			pass.focus();
		};

		var changeTypePassUser = function (el) {
			const pass = document.getElementById("username");
			const type = pass.getAttribute("type");
			if (type == "text") {
				el.innerHTML = IconEyeClosed(cfgStyle.input.icon, "w-6 h-6 md:w-8 md:h-8 lg:w-6 lg:h-6");
				pass.setAttribute("type", "password");
			} else {
				el.innerHTML = IconEye(cfgStyle.input.icon, "w-6 h-6 md:w-8 md:h-8 lg:w-6 lg:h-6");
				pass.setAttribute("type", "text");
			}
			pass.focus();
		};

		window.loginTypo = function (data, dataLoginOpt) {
			if (!username || !password) {
				return;
			}

			username.onkeyup = setCase;

			// Phone Number and PIN are independent credentials: never mirror one
			// into the other (ADR 0004).
			function setCase() {
				var caseType = dataLoginOpt == 0 ? data.voucher.value : data.member.value;
				if (caseType == "upper") {
					username.value = username.value.toUpperCase();
				} else if (caseType == "lower") {
					username.value = username.value.toLowerCase();
				}
			}
		};

	</script>

	<script src="./config/data/audio.js?v=21.1"></script>
	<script src="./config/data/bioLink.js?v=21.1"></script>
	<script src="./config/data/chat.js?v=21.1"></script>
	<script src="./config/data/copyRight.js?v=21.1"></script>
	<script src="./config/data/expiredMikhmon.js?v=21.1"></script>
	<script src="./config/data/faq.js?v=21.1"></script>
	<script src="./config/data/header.js?v=21.1"></script>
	<script src="./config/data/internetPackage.js?v=21.1"></script>
	<script src="./config/data/voucher.js?v=21.2"></script>
	<script src="./config/data/licence.js?v=21.1"></script>
	<script src="./config/data/login.js?v=21.3"></script>
	<script src="./config/data/popup.js?v=21.1"></script>
	<script src="./config/data/runningText.js?v=21.1"></script>
	<script src="./config/data/socialMedia.js?v=21.1"></script>
	<script src="./config/data/store.js?v=21.1"></script>
	<script src="./config/data/menu.js?v=21.1"></script>
	<script src="./config/data/slide.js?v=21.1"></script>
	<script src="./config/data/prayTimes.js?v=21.1"></script>
	<script src="./config/creator.js?v=21.1"></script>
	<script id="siema" src="./assets/siema.min.js"></script>
	<script id="praytimes" src="./assets/praytimes.js"></script>
	<script id="dayjs" src="./assets/dayjs.min.js"></script>
	<script id="mainscript" src="./assets/app.min.js?v="></script>

	<script src="./assets/md5.js?v=21.1"></script>

	<script src="./assets/voucher-client.js?v=21.4"></script>

	<script>
		// Login mode control (ADR 0006). The form title, field shape and
		// placeholders come from the active mode descriptor, and the segmented
		// control is rendered only when more than one mode is enabled. Phone
		// Number + PIN is the default, so nothing changes unless config enables
		// another mode. The expired-account message stays shared by every mode,
		// while the credential message follows the mode.
		(function () {
			var api = window.VoucherClient;
			var client = api && api.client;
			window.currentLoginMode = "phone";

			var serverError = document.getElementById("serverError");
			var rawServerError = serverError ? (serverError.textContent || "").trim() : "";
			if (rawServerError.indexOf("$(") !== -1) {
				rawServerError = "";
			}

			function translateServerError() {
				if (client && typeof client.describeError === "function" && serverError && rawServerError) {
					serverError.textContent = client.describeError(rawServerError, "", window.currentLoginMode);
				}
			}

			var modesContainer = document.getElementById("loginModes");
			if (client && typeof client.renderLoginModes === "function" && modesContainer) {
				var control = client.renderLoginModes(modesContainer, {
					onChange: function (mode) {
						window.currentLoginMode = mode;
						translateServerError();
					},
				});
				window.currentLoginMode = control.mode;
			} else {
				// The mode control is unavailable (client failed to load): reveal the
				// default mode's PIN field so Phone Number + PIN login still works.
				var pinGroup = document.getElementById("domPassword");
				if (pinGroup) {
					pinGroup.classList.remove("hidden");
				}
			}

			translateServerError();
		})();
	</script>

	<script>
		// Render the Package list from the backend. The client shows loading,
		// empty and error states and never rejects on a failed fetch, so an
		// unreachable backend does not break the hotspot login form below.
		(function () {
			var container = document.getElementById("paketInternet");
			var api = window.VoucherClient;
			if (!container || !api || !api.client || typeof api.client.loadPackages !== "function") {
				return;
			}
			container.classList.remove("hidden");
			api.client.loadPackages(container);
		})();
	</script>

</body>
