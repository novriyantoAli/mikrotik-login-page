# Backend configuration sample.
#
# Copy to config.yaml only if you prefer a file to environment variables; every
# key can be overridden by the environment variable of the same name in
# SECTION_KEY form (postgres.host -> POSTGRES_HOST). See ../.env.example.

app:
  name: mikrotik-login-page
  environment: production # development | production

server:
  host: 0.0.0.0
  port: 8080
  read_timeout: 10s
  write_timeout: 15s
  idle_timeout: 60s
  shutdown_timeout: 15s # at most 25s; the process lifecycle budget is 30s
  # Comma-separated CIDRs allowed to set X-Forwarded-For; empty trusts nobody.
  trusted_proxies: ""

logger:
  level: info # debug | info | warn | error
  format: json # json | console
  output_path: stdout # stdout | stderr | file path

postgres:
  host: localhost
  port: 5432
  user: hotspot
  password: ""
  database: hotspot
  ssl_mode: disable
  search_path: "" # tests pin a throwaway schema here
  max_open_conns: 20
  max_idle_conns: 10
  conn_max_lifetime: 30m

freeradius_mysql:
  host: localhost
  port: 3306
  user: radius
  password: ""
  database: radius
  max_open_conns: 10
  max_idle_conns: 5
  conn_max_lifetime: 30m

redis:
  addr: localhost:6379
  password: ""
  db: 0
  dial_timeout: 5s

worker:
  concurrency: 10
  queues: [critical, default, low]

health:
  timeout: 2s

auth:
  magic_link_ttl: 15m
  session_ttl: 720h
  cookie_secure: false
  cookie_name: session
  # Origin the SMS link points at; the app route that redeems the token.
  app_base_url: http://localhost:5173
  magic_link_path: /masuk/tautan
  # Absolute Login Page URLs a `return` may name; empty drops every return.
  login_page_allowlist: []
  rate_limit:
    phone_window: 5m
    phone_limit: 1
    ip_window: 5m
    ip_limit: 10

transaction:
  # How long a buyer has to pay before the worker expires the Transaction.
  payment_ttl: 1h
  # How often the worker closes overdue pending Transactions.
  expiry_sweep_interval: 1m

tripay:
  # Empty credentials let the stack boot; checkout reports 502 until they are set.
  api_key: ""
  private_key: ""
  merchant_code: ""
  base_url: https://tripay.co.id/api-sandbox
  # Public URL Tripay posts settlements to (the API's /api path).
  callback_url: http://localhost:8080/api/payments/callback
  # Fallback destination after paying; the app navigates itself.
  return_url: http://localhost:8080/
  request_timeout: 20s

sms:
  device: /dev/ttyUSB0
  baud: 115200
  command_timeout: 10s
  lease: 2m
  sweep_interval: 30s
  max_attempts: 5
  retry_backoff: 1m
