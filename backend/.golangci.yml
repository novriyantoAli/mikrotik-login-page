# Linters required by the backend standard. Run with `make lint-golangci`
# (needs a golangci-lint built with a Go version that can read backend/go.mod).
run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - funlen
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - staticcheck
    - unused

linters-settings:
  funlen:
    lines: 80
    statements: 50
  gocyclo:
    min-complexity: 15
  lll:
    line-length: 120
  misspell:
    locale: US

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - funlen
        - gocyclo
        - gosec
        - lll
