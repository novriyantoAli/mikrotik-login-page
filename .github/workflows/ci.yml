name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  login-page:
    name: Login Page (unit + browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke

  frontend:
    name: Purchase app (typecheck, lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  app-layout:
    name: Purchase app (360px layout)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the app's dependencies
        run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
      - run: npm run test:app

  backend:
    name: Backend (lint, unit, integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hotspot
          POSTGRES_PASSWORD: hotspot
          POSTGRES_DB: hotspot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hotspot -d hotspot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: radius
          MYSQL_USER: radius
          MYSQL_PASSWORD: radius
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -proot --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 user=hotspot password=hotspot dbname=hotspot sslmode=disable
      TEST_REDIS_ADDR: 127.0.0.1:6379
      TEST_FREERADIUS_MYSQL_DSN: radius:radius@tcp(127.0.0.1:3306)/radius
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: make -C backend deps
      - name: Install linters
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # Pinned rather than `@latest` (the Makefile's convenience default) so a swag
      # release cannot red a build that did not change. The Definition of Done
      # requires `make swagger-gen` to work, so the gate runs it: three annotations
      # had named a `dto.*` type in files that never import it, and the target sat
      # broken until someone noticed (ADR 0021).
      - name: Install swag
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.4
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make -C backend lint
      - run: make -C backend swagger-gen
      - run: make -C backend test

  # The one job that runs the whole chain against a real stack (ADR 0018 §5).
  # Separate from `backend` so a journey failure is attributable, and so the fast
  # signal stays fast. The vendor is stubbed and the modem is absent — the ADR
  # says exactly what that does and does not prove.
  e2e-compose:
    name: E2E (compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # The compose file requires secrets with `:?`, and the stub signs callbacks
      # with the same private key the backend verifies. Ephemeral values only:
      # this stack never talks to a real vendor.
      - name: Prepare .env for the stack
        run: |
          cp .env.example .env
          cat >> .env <<'ENV'
          POSTGRES_PASSWORD=ci-postgres
          FREERADIUS_MYSQL_PASSWORD=ci-radius
          FREERADIUS_MYSQL_ROOT_PASSWORD=ci-radius-root
          REDIS_PASSWORD=ci-redis
          TRIPAY_PRIVATE_KEY=ci-e2e-stub-private-key
          SMS_DEVICE=/dev/ttyE2E-does-not-exist
          ENV

      - name: Bring the stack up
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build

      - name: Wait for the API and the worker
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/health > /dev/null \
              && curl -fsS http://127.0.0.1:8081/healthz > /dev/null; then
              echo "stack siap setelah ${attempt} percobaan"
              exit 0
            fi
            sleep 5
          done
          echo "stack tidak siap dalam 300 detik"
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml ps
          exit 1

      # The journey reads the Magic Link out of `sms_outbox`, the only place it
      # exists. Prove that read works before the browser run: a wrong query would
      # otherwise surface as a vague "element not found" twenty seconds later.
      - name: Prove the outbox is readable
        run: |
          printf 'select count(*) from sms_outbox' | \
            docker compose -f docker-compose.yml -f docker-compose.e2e.yml exec -T postgres \
              sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DATABASE" -tA'

      - run: npx playwright test -c playwright.e2e.config.mjs --project=stub

      - name: Stack logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --tail=200

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Tear the stack down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v
