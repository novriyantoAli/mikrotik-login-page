# Serves the Admin Panel SPA (ADR 0028). The public origin is the reverse proxy in
# front of this container, and that proxy forwards /admin unchanged, so this
# server strips the one prefix and answers from its own static root: the shell
# addresses its assets as /admin/_app/... but they live at /_app/... on disk.
#
# The panel states its own headers here rather than inheriting the purchase app's:
# a different app, a different audience, and no vendor QR to accommodate. Only
# what a document <meta> cannot express is sent as a header (framing); the
# document policy itself comes from the build's <meta> tag, because SvelteKit's
# inline bootstrap script has a per-build hash a static header cannot know. A
# second, stricter policy here would intersect with that one and leave a blank app.
server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    # Hashed assets: the build's file names are content-addressed, so a year is
    # safe and only the shell has to stay uncached. The prefix strip is the same
    # one-liner as the SPA block below — the two must change together, or the
    # shell's /admin/_app/... requests stop resolving.
    location /admin/_app/immutable/ {
        rewrite ^/admin/(.*)$ /$1 break;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Declaring `add_header` here stops the inherited set (see the shell
        # block), so the headers every response must carry are repeated.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    # One spelling of the entry point is the proxy's job, not this container's: a
    # `return 301` here would build an absolute Location from this server's own
    # scheme and port (plain http, 80) and send a browser that reached the panel on
    # :8080 to :80 instead. A bare `/admin` therefore falls through to the 404
    # below; the proxy never forwards it.

    # Everything else under /admin is the SPA: a deep link such as /admin/paket
    # has no file on disk, so it falls back to the shell and the client router
    # takes over. The prefix strip is the same one-liner as the assets block.
    location /admin/ {
        rewrite ^/admin/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    # The shell is never cached: a stale index.html asks for asset hashes the
    # current build has already replaced. Declaring `add_header` in a block stops
    # nginx from inheriting the server-level set, so the headers the document
    # must still carry are repeated here.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }

    # This container is reachable only through the proxy's /admin block, so
    # anything else is a misroute rather than a page: answering it would serve the
    # panel on paths that belong to the purchase app.
    location / {
        return 404;
    }
}
