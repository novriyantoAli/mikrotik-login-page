# Single-origin front door (ADR 0009): the purchase app at /, the backend at /api,
# and the Admin Panel at /admin (ADR 0028).
# TLS terminates in front of this proxy; the client's scheme is preserved in
# X-Forwarded-Proto so the backend can set Secure cookies and https:// links.
#
# There is no CORS configuration because there is no second origin.

# Preserve the scheme a TLS terminator in front of us observed.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
}

# The public host **with its port**, for the one redirect this proxy states
# itself. `$host` drops the port, and a Location built without it sends a browser
# on `:8080` to `:80`; an HTTP/1.0 client without a Host header falls back to
# `$host` rather than producing `https:///`.
map $http_host $public_host {
    default $http_host;
    ""      $host;
}

# The status screen polls this endpoint; cap the fan-out per client so a
# degraded dependency cannot be turned into a connection-pool flood.
limit_req_zone $binary_remote_addr zone=health:1m rate=5r/s;

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    # The SPA ships its own policy in a <meta> tag (`kit.csp` hash mode in
    # frontend/svelte.config.js), because SvelteKit's inline bootstrap script has
    # a per-build hash that a static header cannot know. Two policies intersect,
    # so this header carries only what <meta> cannot express: framing. Writing
    # `default-src 'self'` here instead silently blocks that bootstrap script and
    # leaves a blank app — which is exactly what the E2E journey caught.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    location = /api/health {
        limit_req zone=health burst=10 nodelay;

        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 30s;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 30s;
    }

    # The Admin Panel is its own artefact (ADR 0028) mounted on this origin. The
    # panel's container states its own headers — its own CSP, its own cache
    # policy — so this block only forwards: a document policy declared here would
    # intersect with the panel's and can block SvelteKit's inline bootstrap. The
    # server-level `frame-ancestors 'none'` above still applies and says the same
    # thing the panel says, so the intersection is unchanged.
    #
    # `location /admin` (no trailing slash) also covers `/admin` itself, which the
    # panel redirects to `/admin/`. It is an unanchored prefix, so `/administrator`
    # matches too: the panel's container answers 404 for anything outside `/admin`,
    # which keeps that a misroute rather than a page.
    #
    # The trailing-slash redirect is stated **here**, not by the panel's container:
    # a `return 301` inside that container builds an absolute Location from its own
    # scheme and listening port (80, plain http), so `/admin` on `:8080` would send
    # the browser to `http://localhost/admin/` and a refused connection. The e2e
    # run found exactly that (PR #48).
    location = /admin {
        return 301 $forwarded_proto://$public_host/admin/;
    }

    location /admin {
        proxy_pass http://admin:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://app:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
